services:
  szurubooru-toolkit:
    image: reluce/szurubooru-toolkit
    container_name: szurubooru-toolkit
    restart: on-failure
    # Run cron jobs as this user instead of root, e.g. for NFS mounts
    # or rootless containers
    #environment:
    #  - PUID=1000
    #  - PGID=1000
    # Expose the GPU for the -wd-tagger-cuda image (requires the NVIDIA
    # Container Toolkit on the host). Use the latest-wd-tagger-cuda image above.
    # Uncomment this block for NVIDIA GPU access:
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: all
    #          capabilities: [gpu]
    # Alternatively, Docker Compose >= 2.30.0 supports the shorthand below.
    # Enable only one of these GPU configurations.
    #gpus: all
    volumes:
      - ./crontab:/etc/cron.d/crontab
      - ./config.toml:/szurubooru-toolkit/config.toml
      - ./misc:/szurubooru-toolkit/misc
      - ./upload_src:/szurubooru-toolkit/upload_src
      - ./szurubooru_toolkit.log:/szurubooru-toolkit/szurubooru_toolkit.log
      - ./tmp:/szurubooru-toolkit/tmp
