name: test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Unit tests
        run: uv run pytest -q

      # Runs the CLI against a fake szurubooru server (tag-posts, delete-posts)
      - name: Smoke test
        run: python3 .claude/skills/run-szurubooru-toolkit/driver.py smoke
